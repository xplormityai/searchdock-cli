name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Check release tag
        run: node -e "if ('v'+require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: python -m pip install build twine
      - run: npm run release:artifacts
      - run: python scripts/check_artifacts.py
      - run: python scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/releases/
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - name: Publish missing npm version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/searchdock-cli/$VERSION")
          if [ "$STATUS" = "404" ]; then
            npm publish "packages/searchdock-cli-$VERSION.tgz" --access public --provenance
          elif [ "$STATUS" != "200" ]; then
            echo "Registry check failed: HTTP $STATUS"
            exit 1
          fi
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Select Python archives
        run: |
          mkdir python-packages
          cp packages/*.whl packages/*.tar.gz python-packages/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-packages/
          skip-existing: true
  github:
    needs: [build, npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "SearchDock CLI $GITHUB_REF_NAME" --generate-notes
          fi
